[pytest]
testpaths = tests
# Default run = synthetic unit tests + artifact invariants (seconds). Excluded by
# default: the metric pins, which fit gradient-boosted models, and anything needing
# the 918MB source SQLite or the EPA shapefiles. The artifact tests skip themselves
# cleanly when the generated parquets are absent, so this stays runnable on a fresh
# clone; use `-o addopts=""` to override the filter entirely.
addopts = -m "not slow and not requires_raw" --strict-markers -q
markers =
    requires_data: needs the generated parquet artifacts (run the pipeline first)
    slow: re-derives headline metrics; some fit gradient-boosted models
    requires_raw: needs the source SQLite or the EPA shapefiles
